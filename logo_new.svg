<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000"/>
      <stop offset="100%" style="stop-color:#CC0000"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#333" stroke-width="2"/>
  <!-- Shield -->
  <path d="M60 20 L88 32 L88 58 Q88 80 60 98 Q32 80 32 58 L32 32 Z" 
        fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Checkmark -->
  <path d="M45 60 L55 70 L78 44" 
        fill="none" stroke="#3ea6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Play triangle accent (top right of shield) -->
  <path d="M68 34 L80 40 L68 46 Z" fill="#3ea6ff" opacity="0.7"/>
</svg>